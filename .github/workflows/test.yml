name: offline-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.2"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install --requirement requirements.lock.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/check_security_requirements.py --stage build
      - run: python scripts/check_secrets.py
      - run: ruff check . --exclude .venv --select E9,F
      - run: bandit -q -r agent.py app.py config.py backend database services security tools workflows evals scripts -x tests,backend/tests
      - run: pip-audit --requirement requirements.lock.txt --no-deps --disable-pip --progress-spinner off
      - run: python -m pytest -q -p no:cacheprovider --basetemp .pytest-ci
      - run: python scripts/run_load_check.py --duration-seconds 2 --fake-provider-delay-seconds 0.2

  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.6-alpine
        env:
          POSTGRES_DB: bizpilot_test
          POSTGRES_USER: bizpilot_migration
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bizpilot_migration -d bizpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIZPILOT_TEST_DATABASE_URL: postgresql+psycopg://bizpilot_migration:test-only-password@localhost:5432/bizpilot_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.2"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install --requirement requirements.lock.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pytest -q backend/tests/integration -p no:cacheprovider --basetemp .pytest-postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run browser:security
        env:
          BIZPILOT_BROWSER_CHANNEL: chromium
      - run: npm run verify:build

  docker:
    needs: [test, postgres-rls, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag bizpilot-pilot:${{ github.sha }} .
